name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR checks, never lose a main push's publication range.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Documentation-only changes skip everything below: no check here reads
      # Markdown. An unknown range is never treated as documentation.
      - name: Changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="origin/$BASE...HEAD"; else range="$BEFORE..HEAD"; fi
          if files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ] \
             && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE)'; then
            echo "application=false" >> "$GITHUB_OUTPUT"; echo "Documentation only: checks skipped"
          else
            echo "application=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.application == 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.scope.outputs.application == 'true'
        run: npm install --legacy-peer-deps
      - if: steps.scope.outputs.application == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.application == 'true'
        run: npm run lint
      # A pull request runs only the tests related to files it changed; the
      # merge to main runs the whole suite.
      - name: Unit tests
        if: steps.scope.outputs.application == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx vitest run --changed "origin/$BASE" --passWithNoTests
          else
            npm test
          fi
      - if: steps.scope.outputs.application == 'true'
        run: npm run build
