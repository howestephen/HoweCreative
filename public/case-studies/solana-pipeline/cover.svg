<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff003c"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#0a0c10"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>

  <!-- header -->
  <rect x="80" y="76" width="14" height="14" fill="#ff003c"/>
  <text x="112" y="90" font-size="24" letter-spacing="6" fill="#9296a5">AUTONOMOUS CONTENT PIPELINE</text>
  <text x="1520" y="90" text-anchor="end" font-size="24" fill="#5c6070">2026 / LIVE</text>

  <!-- pipeline nodes -->
  <g>
    <!-- Solana -->
    <rect x="90" y="420" width="220" height="120" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
    <text x="200" y="472" text-anchor="middle" font-size="28" fill="#ffffff">SOLANA</text>
    <text x="200" y="508" text-anchor="middle" font-size="19" fill="#9296a5">on-chain data</text>

    <!-- Monitor -->
    <rect x="390" y="420" width="220" height="120" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
    <text x="500" y="472" text-anchor="middle" font-size="28" fill="#ffffff">MONITOR</text>
    <text x="500" y="508" text-anchor="middle" font-size="19" fill="#9296a5">datasets → Postgres</text>

    <!-- Render -->
    <rect x="690" y="420" width="220" height="120" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
    <text x="800" y="472" text-anchor="middle" font-size="28" fill="#ffffff">RENDER</text>
    <text x="800" y="508" text-anchor="middle" font-size="19" fill="#9296a5">generated assets</text>

    <!-- Approve -->
    <rect x="990" y="420" width="220" height="120" rx="10" fill="#12151b" stroke="#ff003c" stroke-width="2"/>
    <text x="1100" y="472" text-anchor="middle" font-size="28" fill="#ffffff">APPROVE</text>
    <text x="1100" y="508" text-anchor="middle" font-size="19" fill="#ff3358">one tap · Telegram</text>

    <!-- X -->
    <rect x="1290" y="420" width="220" height="120" rx="10" fill="#ff003c"/>
    <text x="1400" y="472" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">POST TO X</text>
    <text x="1400" y="508" text-anchor="middle" font-size="19" fill="#ffd3dd">3 slots / day</text>
  </g>

  <!-- arrows -->
  <g stroke="#ff003c" stroke-width="3" fill="none">
    <line x1="310" y1="480" x2="378" y2="480" marker-end="url(#arr)"/>
    <line x1="610" y1="480" x2="678" y2="480" marker-end="url(#arr)"/>
    <line x1="910" y1="480" x2="978" y2="480" marker-end="url(#arr)"/>
    <line x1="1210" y1="480" x2="1278" y2="480" marker-end="url(#arr)"/>
  </g>

  <!-- automation bracket -->
  <g stroke="#3a3f4d" stroke-width="2" fill="none">
    <path d="M90 620 v20 h820 v-20"/>
    <path d="M990 620 v20 h520 v-20"/>
  </g>
  <text x="500" y="690" text-anchor="middle" font-size="21" fill="#9296a5">AUTOMATED PRODUCTION</text>
  <text x="1250" y="690" text-anchor="middle" font-size="21" fill="#9296a5">HUMAN JUDGEMENT + PUBLISH</text>

  <!-- footer -->
  <text x="80" y="920" font-size="22" fill="#5c6070">SOLANA → X · MONITOR / RENDER / POST · HUMAN-IN-THE-LOOP</text>
</svg>
