<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff003c"/>
    </marker>
    <marker id="arrg3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f7482"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#0a0c10"/>

  <rect x="80" y="70" width="14" height="14" fill="#ff003c"/>
  <text x="112" y="84" font-size="24" letter-spacing="6" fill="#9296a5">HUMAN-IN-THE-LOOP APPROVAL</text>
  <text x="1520" y="84" text-anchor="end" font-size="22" fill="#5c6070">SECONDS OF EFFORT PER POST</text>

  <!-- steps -->
  <rect x="90" y="300" width="250" height="130" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
  <text x="215" y="352" text-anchor="middle" font-size="25" fill="#ffffff">SLOT FIRES</text>
  <text x="215" y="388" text-anchor="middle" font-size="18" fill="#9296a5">cron or event trigger</text>

  <rect x="420" y="300" width="250" height="130" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
  <text x="545" y="345" text-anchor="middle" font-size="25" fill="#ffffff">DRAFT BUILT</text>
  <text x="545" y="380" text-anchor="middle" font-size="18" fill="#9296a5">deterministic copy</text>
  <text x="545" y="408" text-anchor="middle" font-size="18" fill="#9296a5">+ rendered asset</text>

  <!-- telegram message mock -->
  <g>
    <rect x="750" y="220" width="360" height="300" rx="14" fill="#12151b" stroke="#ff003c" stroke-width="2"/>
    <rect x="750" y="220" width="360" height="54" rx="14" fill="#171a21"/>
    <rect x="750" y="254" width="360" height="20" fill="#171a21"/>
    <text x="778" y="256" font-size="20" fill="#ffffff">TELEGRAM · APPROVAL BOT</text>
    <rect x="778" y="300" width="140" height="90" rx="6" fill="#1c202a"/>
    <text x="848" y="352" text-anchor="middle" font-size="16" fill="#5c6070">[ASSET]</text>
    <text x="940" y="320" font-size="17" fill="#c9ccd6">slot 12:10 ET</text>
    <text x="940" y="348" font-size="17" fill="#c9ccd6">post family: daily</text>
    <text x="940" y="376" font-size="17" fill="#c9ccd6">copy: ready</text>
    <rect x="778" y="420" width="150" height="58" rx="8" fill="#ff003c"/>
    <text x="853" y="456" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">APPROVE</text>
    <rect x="944" y="420" width="140" height="58" rx="8" fill="none" stroke="#3a3f4d" stroke-width="2"/>
    <text x="1014" y="456" text-anchor="middle" font-size="20" fill="#9296a5">SKIP</text>
  </g>

  <!-- outcomes -->
  <rect x="1230" y="240" width="280" height="130" rx="10" fill="#ff003c"/>
  <text x="1370" y="292" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">PUBLISHED</text>
  <text x="1370" y="328" text-anchor="middle" font-size="18" fill="#ffd3dd">posted to X + logged</text>

  <rect x="1230" y="430" width="280" height="130" rx="10" fill="#12151b" stroke="#2a2e38" stroke-width="2"/>
  <text x="1370" y="482" text-anchor="middle" font-size="25" fill="#ffffff">RETRY / FLAG</text>
  <text x="1370" y="518" text-anchor="middle" font-size="18" fill="#9296a5">failures surfaced clearly</text>

  <!-- arrows -->
  <g stroke="#ff003c" stroke-width="3" fill="none">
    <line x1="340" y1="365" x2="408" y2="365" marker-end="url(#arr3)"/>
    <line x1="670" y1="365" x2="738" y2="365" marker-end="url(#arr3)"/>
    <line x1="1110" y1="305" x2="1218" y2="305" marker-end="url(#arr3)"/>
  </g>
  <g stroke="#6f7482" stroke-width="2.5" fill="none">
    <line x1="1110" y1="490" x2="1218" y2="490" marker-end="url(#arrg3)"/>
    <path d="M1370 560 v90 H545 V442" marker-end="url(#arrg3)"/>
  </g>
  <text x="1128" y="290" font-size="17" fill="#ff3358">approve</text>
  <text x="1128" y="475" font-size="17" fill="#9296a5">error</text>
  <text x="820" y="680" font-size="17" fill="#9296a5">retry rebuilds the draft — never double-posts</text>

  <text x="80" y="920" font-size="22" fill="#5c6070">THE PIPELINE DOES THE PRODUCTION · THE HUMAN OWNS THE DECISION</text>
</svg>
